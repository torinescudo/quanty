# ---------------------------------------------------------------------------
# Quanty — paper-trading stack.
#
#   freqtrade  trading engine (REST + WS on :8080 inside the network)
#   bridge     FastAPI dashboard + proxy to freqtrade (exposed on :8000)
#
# Usage:
#   docker compose up -d
#   docker compose logs -f bridge
#   curl localhost:8000/healthz
#   curl localhost:8000/readyz
#
# Override credentials / log level via a sibling ``.env`` file or
# ``-e VAR=value`` on the command line.
# ---------------------------------------------------------------------------

services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: quanty-freqtrade
    restart: unless-stopped
    command: >
      trade
      --strategy SmaCross
      --userdir /freqtrade/user_data
    volumes:
      - ./user_data:/freqtrade/user_data
    expose:
      - "8080"
    healthcheck:
      # /api/v1/ping is unauthenticated and always returns 200 once the
      # REST server is up. This gates the bridge container's start.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - quanty

  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: quanty-bridge:latest
    container_name: quanty-bridge
    restart: unless-stopped
    depends_on:
      freqtrade:
        condition: service_healthy
    environment:
      FREQTRADE_URL: http://freqtrade:8080
      FREQTRADE_USER: ${FREQTRADE_USER:-}
      FREQTRADE_PASS: ${FREQTRADE_PASS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BRIDGE_CORS_ORIGINS: ${BRIDGE_CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - quanty

networks:
  quanty:
    driver: bridge
